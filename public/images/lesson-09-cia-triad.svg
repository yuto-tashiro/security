<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">機密性・完全性・可用性</title><desc id="diagram-desc">CIAの三つの観点を三角形で結び、宛先、内容、必要な時の利用を同時に考える。順番を示す矢印ではない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><path d="M280 161 L126 425" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 425 L434 425" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M434 425 L280 161" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="280" cy="140" r="98" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="3"/><g transform="translate(254 65) scale(0.85)"><rect x="5" y="24" width="46" height="35" rx="5" fill="#e8f0dd" stroke="#39714d" stroke-width="2"/><path d="M15 24V14a13 13 0 0126 0v10" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 36v12" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="280" y="171" font-size="34" font-weight="600" text-anchor="middle" fill="#183e39">機密性</text><text x="280" y="211" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">宛先・閲覧</text><circle cx="126" cy="435" r="98" fill="#e4eef2" stroke="#a8bfa0" stroke-width="3"/><g transform="translate(101 362) scale(0.85)"><path d="M5 30l16 16L55 9" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="126" y="464" font-size="34" font-weight="600" text-anchor="middle" fill="#183e39">完全性</text><text x="126" y="506" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">正しい内容</text><circle cx="434" cy="435" r="98" fill="#fff1e3" stroke="#a8bfa0" stroke-width="3"/><g transform="translate(408 365) scale(0.85)"><rect x="0" y="0" width="66" height="43" rx="4" fill="white" stroke="#39714d" stroke-width="2"/><path d="M33 43 L33 56" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 56 L49 56" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="434" y="464" font-size="34" font-weight="600" text-anchor="middle" fill="#183e39">可用性</text><text x="434" y="506" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">必要な時に</text><text x="280" y="317" font-size="30" font-weight="600" text-anchor="middle" fill="#183e39">記録を守る</text><text x="280" y="590" font-size="30" font-weight="600" text-anchor="middle" fill="#183e39">三つを同時に考える</text></g></svg>
