<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 680" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">偽メールから偽サイトへの誘導</title><desc id="diagram-desc">管理者を装うメールが偽のログイン画面へ誘導し、入力すると認証情報が渡る場合がある。公式の別経路で確認し、気付いたら報告する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><rect x="45" y="20" width="470" height="115" rx="18" fill="#fff1e3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(75 45) scale(0.95)"><rect x="0" y="6" width="66" height="45" rx="5" fill="white" stroke="#39714d" stroke-width="2"/><path d="M2 8l31 25L64 8" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="305" y="69" font-size="29" font-weight="600" text-anchor="middle" fill="#183e39">管理者を装うメール</text><text x="305" y="110" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">「今日中に」</text><path d="M280 142 L280 181" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="70" y="198" width="420" height="183" rx="18" fill="white" stroke="#a64c42" stroke-width="2"/><rect x="70" y="198" width="420" height="44" rx="12" fill="#fff1e3" stroke="#a64c42" stroke-width="2"/><text x="280" y="230" font-size="28" font-weight="600" text-anchor="middle" fill="#183e39">偽の画面（例）</text><text x="280" y="295" font-size="32" font-weight="600" text-anchor="middle" fill="#183e39">再ログインの誘導</text><rect x="140" y="321" width="280" height="39" rx="5" fill="#fff1e3" stroke="#a64c42" stroke-width="2"/><path d="M280 390 L280 430" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="280" y="478" font-size="31" font-weight="700" text-anchor="middle" fill="#a64c42">認証情報が渡る場合も</text><rect x="35" y="531" width="490" height="119" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(59 554) scale(0.95)"><path d="M30 0L55 10v20c0 18-14 29-25 34C19 59 5 48 5 30V10z" fill="#e8f0dd" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 31l9 9 18-22" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="323" y="579" font-size="29" font-weight="600" text-anchor="middle" fill="#183e39">公式の別経路で確認</text><text x="323" y="622" font-size="29" font-weight="600" text-anchor="middle" fill="#183e39">気付いたら報告</text></g></svg>
