<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">認証・更新・監視・復旧の多層防御</title><desc id="diagram-desc">認証と権限、更新と端末保護、監視と報告、バックアップ、代替手順と復旧を組み合わせる。順番ではなく、異なる役割の守り。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><rect x="30" y="15" width="500" height="111" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(56 43) scale(0.9)"><rect x="5" y="24" width="46" height="35" rx="5" fill="#e8f0dd" stroke="#39714d" stroke-width="2"/><path d="M15 24V14a13 13 0 0126 0v10" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 36v12" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="171" y="59" font-size="31" font-weight="700" text-anchor="start" fill="#183e39">認証・権限</text><text x="171" y="101" font-size="26" font-weight="400" text-anchor="start" fill="#183e39">必要な人だけ使う</text><rect x="30" y="141" width="500" height="111" rx="18" fill="#e4eef2" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(56 169) scale(0.9)"><rect x="5" y="0" width="46" height="60" rx="4" fill="white" stroke="#39714d" stroke-width="2"/><path d="M14 15 L42 15" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 27 L42 27" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 39 L34 39" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="171" y="185" font-size="31" font-weight="700" text-anchor="start" fill="#183e39">更新・端末</text><text x="171" y="227" font-size="26" font-weight="400" text-anchor="start" fill="#183e39">弱点や紛失に備える</text><rect x="30" y="267" width="500" height="111" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(56 295) scale(0.9)"><path d="M1 29Q30-6 59 29Q30 64 1 29z" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="29" r="11" fill="#e8f0dd" stroke="#39714d" stroke-width="3"/></g><text x="171" y="311" font-size="31" font-weight="700" text-anchor="start" fill="#183e39">監視・報告</text><text x="171" y="353" font-size="26" font-weight="400" text-anchor="start" fill="#183e39">異常に早く気付く</text><rect x="30" y="393" width="500" height="111" rx="18" fill="#e4eef2" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(56 421) scale(0.9)"><rect x="3" y="0" width="54" height="64" rx="5" fill="white" stroke="#39714d" stroke-width="2"/><rect x="12" y="10" width="36" height="25" rx="3" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><path d="M16 58 L16 65" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 58 L28 65" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 58 L40 65" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="171" y="437" font-size="31" font-weight="700" text-anchor="start" fill="#183e39">バックアップ</text><text x="171" y="479" font-size="26" font-weight="400" text-anchor="start" fill="#183e39">保護したコピー</text><rect x="30" y="519" width="500" height="111" rx="18" fill="#fff1e3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(56 547) scale(0.9)"><path d="M9 14a23 23 0 111 33M9 1v16h16" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M32 15v17l11 7" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="171" y="563" font-size="31" font-weight="700" text-anchor="start" fill="#183e39">代替手