<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 610" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">URL・DNS・HTTPS・ページ表示</title><desc id="diagram-desc">ブラウザーはDNSへ宛先を問い合わせ、HTTPSでWebサーバーと要求・応答を行い、HTML等を表示する。DNSはWeb通信の中継点ではない。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><rect x="25" y="30" width="285" height="177" rx="18" fill="white" stroke="#a8bfa0" stroke-width="2"/><rect x="25" y="30" width="285" height="43" rx="12" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><text x="167" y="62" font-size="27" font-weight="600" text-anchor="middle" fill="#183e39">公式URL</text><text x="167" y="122" font-size="30" font-weight="600" text-anchor="middle" fill="#183e39">ブラウザー</text><text x="167" y="167" font-size="28" font-weight="400" text-anchor="middle" fill="#183e39">画面を表示</text><rect x="360" y="62" width="175" height="120" rx="18" fill="#e4eef2" stroke="#a8bfa0" stroke-width="2"/><text x="447" y="113" font-size="32" font-weight="600" text-anchor="middle" fill="#183e39">DNS</text><text x="447" y="156" font-size="25" font-weight="400" text-anchor="middle" fill="#183e39">宛先を返す</text><path d="M315 95 L352 95" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M355 152 L317 152" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="334" y="57" font-size="24" font-weight="600" text-anchor="middle" fill="#183e39">照会</text><path d="M110 215 L110 400" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M267 397 L267 220" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="180" y="294" font-size="33" font-weight="600" text-anchor="middle" fill="#183e39">HTTPS</text><text x="66" y="352" font-size="26" font-weight="600" text-anchor="middle" fill="#183e39">要求</text><text x="318" y="352" font-size="26" font-weight="600" text-anchor="middle" fill="#183e39">応答</text><rect x="25" y="420" width="510" height="158" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(70 458) scale(0.9)"><rect x="0" y="0" width="65" height="58" rx="5" fill="white" stroke="#39714d" stroke-width="2"/><path d="M10 19 L55 19" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 39 L55 39" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="48" cy="10" r="3" fill="#39714d"/><circle cx="48" cy="30" r="3" fill="#39714d"/><circle cx="48" cy="49" r="3" fill="#39714d"/></g><text x="280" y="467" font-size="32" font-weight="600" text-anchor="middle" fill="#183e39">Webサーバー</text><text x="280" y="516" font-size="28" font-weight="400" text-anchor="middle" fill="#183e39">HTML・CSS</text><text x="280" y="556" font-size="28" font-weight="400" text-anchor="middle" fill="#183e39">JavaScript など</text></g></svg>
