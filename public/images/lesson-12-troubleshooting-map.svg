<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">記録が開かない時の切り分け</title><desc id="diagram-desc">中央の記録が開かないという症状に、端末、通信、アカウント、サービスの四つの観点を結び付ける。原因を決めつけず事実を報告する。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><path d="M145 173 L223 267" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 173 L337 267" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M145 430 L223 343" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 430 L337 343" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="25" y="15" width="240" height="164" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(52 35) scale(0.85)"><rect x="2" y="1" width="38" height="56" rx="5" fill="white" stroke="#39714d" stroke-width="2"/><path d="M16 51 L27 51" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="9" width="26" height="33" rx="2" fill="#e8f0dd" stroke="#e8f0dd" stroke-width="2"/></g><text x="157" y="78" font-size="32" font-weight="600" text-anchor="middle" fill="#183e39">端末</text><text x="145" y="142" font-size="28" font-weight="400" text-anchor="middle" fill="#183e39">一台だけ？</text><rect x="295" y="15" width="240" height="164" rx="18" fill="#e4eef2" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(316 37) scale(0.85)"><path d="M4 17a40 40 0 0152 0M12 29a27 27 0 0136 0M22 41a12 12 0 0116 0" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="51" r="4" fill="#39714d"/></g><text x="426" y="78" font-size="32" font-weight="600" text-anchor="middle" fill="#183e39">通信</text><text x="415" y="142" font-size="26" font-weight="400" text-anchor="middle" fill="#183e39">接続・回線は？</text><rect x="70" y="265" width="420" height="88" rx="18" fill="white" stroke="#39714d" stroke-width="2"/><text x="280" y="322" font-size="34" font-weight="600" text-anchor="middle" fill="#183e39">記録が開かない</text><rect x="25" y="430" width="240" height="164" rx="18" fill="#e4eef2" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(40 449) scale(0.7)"><path d="M18 12a12 12 0 1024 0 12 12 0 10-24 0" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 57v-5a25 25 0 0150 0v5" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="175" y="489" font-size="27" font-weight="600" text-anchor="middle" fill="#183e39">アカウント</text><text x="145" y="553" font-size="26" font-weight="400" text-anchor="middle" fill="#183e39">本人確認・権限</text><rect x="295" y="430" width="240" height="164" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(311 452) scale(0.8)"><rect x="0" y="0" width="66" height="43" rx="4" fill="white" stroke="#39714d" stroke-width="2"/><path d="M33 43 L33 56" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 56 L49 56" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="439" y="489" font-size="29" font-weight="600" text-anchor="middle" fill="#183e39">サービス</text><text x="415" y="553" font-size="26" font-weight="400" text-anchor="middle" fill="#183e39">他の人も同じ？</text><text x="280" y="636" font-size="28" font-weight="600" text-anchor="middle" fill="#183e39">原因を決めつけず、報告</text></g></svg>
