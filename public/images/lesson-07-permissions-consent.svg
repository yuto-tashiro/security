<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">端末の権限・本人の同意・業務の権限</title><desc id="diagram-desc">スマートフォンのOSのカメラ許可、本人の撮影同意、記録の閲覧・共有権限は三つの別の確認。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><rect x="28" y="99" width="170" height="382" rx="20" fill="white" stroke="#39714d" stroke-width="2"/><rect x="46" y="145" width="134" height="260" rx="8" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(73 190) scale(1.7)"><rect x="5" y="0" width="46" height="60" rx="4" fill="white" stroke="#39714d" stroke-width="2"/><path d="M14 15 L42 15" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 27 L42 27" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 39 L34 39" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="113" y="328" font-size="27" font-weight="600" text-anchor="middle" fill="#183e39">カメラ</text><text x="113" y="367" font-size="27" font-weight="600" text-anchor="middle" fill="#183e39">機能</text><path d="M91 447 L134 447" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="230" y="40" width="306" height="154" rx="18" fill="#f8faf3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(247 78) scale(0.9)"><rect x="5" y="0" width="46" height="60" rx="4" fill="white" stroke="#39714d" stroke-width="2"/><path d="M14 15 L42 15" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 27 L42 27" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 39 L34 39" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="410" y="94" font-size="31" font-weight="600" text-anchor="middle" fill="#183e39">OSの許可</text><text x="410" y="142" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">機能を使う</text><rect x="230" y="235" width="306" height="154" rx="18" fill="#f8faf3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(247 270) scale(0.9)"><path d="M18 12a12 12 0 1024 0 12 12 0 10-24 0" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 57v-5a25 25 0 0150 0v5" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="410" y="289" font-size="31" font-weight="600" text-anchor="middle" fill="#183e39">本人の同意</text><text x="410" y="337" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">撮影の目的</text><rect x="230" y="430" width="306" height="154" rx="18" fill="#f8faf3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(247 469) scale(0.9)"><rect x="5" y="24" width="46" height="35" rx="5" fill="#e8f0dd" stroke="#39714d" stroke-width="2"/><path d="M15 24V14a13 13 0 0126 0v10" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 36v12" fill="none" stroke="#39714d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="410" y="484" font-size="31" font-weight="600" text-anchor="middle" fill="#183e39">業務の権限</text><text x="410" y="532" font-size="27" font-weight="400" text-anchor="middle" fill="#183e39">閲覧・共有</text><text x="280" y="629" font-size="30" font-weight="700" text-anchor="middle" fill="#183e39">三つは別々に確認</text></g></svg>
