<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">アプリ・OS・ドライバー・機器</title><desc id="diagram-desc">アプリの印刷依頼をOSが受け、OS内のドライバーが機器の利用を仲介し、プリンターへ出力する例。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#39714d"/></marker></defs><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"><rect x="45" y="20" width="470" height="120" rx="18" fill="#f8faf3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(70 44) scale(1)"><rect x="5" y="0" width="46" height="60" rx="4" fill="white" stroke="#39714d" stroke-width="2"/><path d="M14 15 L42 15" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 27 L42 27" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 39 L34 39" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="69" font-size="32" font-weight="700" text-anchor="start" fill="#183e39">記録アプリ</text><text x="178" y="109" font-size="28" font-weight="400" text-anchor="start" fill="#183e39">印刷を依頼</text><path d="M280 145 L280 184" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="198" width="470" height="240" rx="18" fill="#e8f0dd" stroke="#a8bfa0" stroke-width="2"/><text x="280" y="245" font-size="30" font-weight="600" text-anchor="middle" fill="#183e39">OS：機器や資源を管理</text><rect x="75" y="278" width="410" height="125" rx="18" fill="white" stroke="#a8bfa0" stroke-width="2"/><text x="280" y="326" font-size="32" font-weight="600" text-anchor="middle" fill="#183e39">ドライバー</text><text x="280" y="369" font-size="28" font-weight="400" text-anchor="middle" fill="#183e39">機器との仲介</text><path d="M280 442 L280 482" stroke="#39714d" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="45" y="495" width="470" height="130" rx="18" fill="#f8faf3" stroke="#a8bfa0" stroke-width="2"/><g transform="translate(75 525) scale(1)"><rect x="9" y="0" width="42" height="24" rx="3" fill="white" stroke="#39714d" stroke-width="2"/><rect x="0" y="18" width="60" height="32" rx="5" fill="#e8f0dd" stroke="#39714d" stroke-width="2"/><rect x="9" y="37" width="42" height="25" rx="2" fill="white" stroke="#39714d" stroke-width="2"/><path d="M17 46 L43 46" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 54 L43 54" fill="none" stroke="#a8bfa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="180" y="548" font-size="32" font-weight="700" text-anchor="start" fill="#183e39">プリンター</text><text x="180" y="590" font-size="28" font-weight="400" text-anchor="start" fill="#183e39">用紙へ出力</text></g></svg>
